server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Documents can be up to 10 MB.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS, asked again every 10 seconds: the API gets a new address
  # each time its container restarts (after a restore, for example), and a
  # name looked up once at start would keep pointing at the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The browser only talks to this container; /api is passed on to the API
  # service, so no CORS setup is needed.
  location /api/ {
    # A variable makes nginx resolve the name per request, not once.
    set $api_upstream http://api:4200;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints everything under /assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Client-side routes all serve the app shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
