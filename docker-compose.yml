name: estates

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estates
      POSTGRES_PASSWORD: estates
      POSTGRES_DB: estates
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estates -d estates']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://estates:estates@db:5432/estates?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Creates demo@example.com / demo-password with a year of sample data.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-4200}:4200'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4200/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5175}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
