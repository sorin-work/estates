name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: estates
          POSTGRES_PASSWORD: estates
          POSTGRES_DB: estates_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estates"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://estates:estates@localhost:5432/estates_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
          working-directory: api

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: docker compose build
      - name: Start the stack and check it answers
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:4200/healthz
          curl -fsS http://localhost:5175/ > /dev/null
          curl -fsS -X POST http://localhost:5175/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"demo-password"}' > /dev/null
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
